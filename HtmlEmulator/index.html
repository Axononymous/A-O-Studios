<!doctype html>
<html>
  <head>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="https://raw.githubusercontent.com/Axononymous/A-O-Studios/main/HtmlEmulator/favicon.png"
    />
    <style>
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        font-size: 20px;
      }
      p.footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        text-shadow: 0 0 8px #a78bfa;
        font-size: 12px;
        text-align: center;
        color: #a78bfa;
      }
      body {
        background-color: #111116;
        font-family: "JetBrains Mono", monospace;
      }
      h1 {
        color: #a78bfa;
        font-family: "JetBrains Mono", monospace;
        text-align: center;
        text-shadow: 0 0 4px black;
        font-size: 40px;
      }
      textarea {
        width: 80%;
        height: 70vh;
        color: #f4f1ff;
        background-color: #1b1a24;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0px 8px 8px rgba(0, 0, 0, 0.1);
        transition:
          box-shadow 0.3s ease-in-out,
          transform 0.3s ease-in-out;
        padding: 20px;
        resize: vertical;
        font-size: 20px;
        outline: #454157;
        resize: none;
      }
      button {
        width: 200px;
        height: 50px;
        border-radius: 12px;
        font-size: 35px;
        background-color: #a78bfa;
        color: #000000;
        margin-top: 10px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        box-shadow:
          0 0 5px #a78bfa,
          0 0 25px #a78bfa;
        margin-bottom: 20px;
        font-size: 20px;
        transition: background-color 0.2s ease;
        transition: box-shadow 0.2s ease;
        transition: transform 0.2s ease;
      }
      button:hover {
        cursor: pointer;
        transform: translateY(-2px);
        font-size: 20px;
        background-color: #c4b5fd;
        box-shadow: 0 0 25px #c4b5fd;
      }
    </style>
  </head>
  <body>
    <h1>Html Emulator</h1>
    <p class="footer">Made by A&O Studios.</p>
    <div class="container">
      <textarea id="code" placeholder="Insert html. . . "></textarea>
      <button onclick="Newtab()">Emulate</button>
    </div>
    <script>
      function Newtab() {
        const code = document.getElementById("code").value;
        const NewWindow = window.open("about:blank", "_blank");
        NewWindow.document.open();
        NewWindow.document.write(code);
        NewWindow.document.close();
      }
    </script>
  </body>
</html>
