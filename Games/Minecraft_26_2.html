  <script>
    async function loadAndRun() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/MartinMMCyt/minecraft@main/26.2/eaglercraft-26.2-0.5.html.part1",
        "https://cdn.jsdelivr.net/gh/MartinMMCyt/minecraft@main/26.2/eaglercraft-26.2-0.5.html.part2",
        "https://cdn.jsdelivr.net/gh/MartinMMCyt/minecraft@main/26.2/eaglercraft-26.2-0.5.html.part3",
        "https://cdn.jsdelivr.net/gh/MartinMMCyt/minecraft@main/26.2/eaglercraft-26.2-0.5.html.part4"

      ];
      let fullHtml = "";
      for (const u of urls) {
        const res = await fetch(u);
        fullHtml += await res.text();
      }

      document.open();
      document.write(fullHtml);
      document.close();
    }

    loadAndRun();
  </script>
